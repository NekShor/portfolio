<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Selector</title>
    <style>
        :root {
            --color-primary: #6d28d9;
            --color-primary-dark: #5b21b6;
            --color-primary-light: #ede9fe;
            --color-accent: #06b6d4;
            --color-bg: #f4f5fb;
            --color-surface: #ffffff;
            --color-border: #e4e4ef;
            --color-text: #1e1b2e;
            --color-muted: #6b7280;
            --color-success: #16a34a;
            --color-success-bg: #e8f8ee;
            --color-danger: #dc2626;
            --color-danger-bg: #fdecec;
            --color-warning: #d97706;
            --color-warning-bg: #fff4e3;
            --radius: 14px;
            --radius-sm: 8px;
            --shadow: 0 2px 6px rgba(30, 27, 46, 0.06), 0 10px 24px rgba(30, 27, 46, 0.05);
            --shadow-hover: 0 6px 16px rgba(30, 27, 46, 0.09), 0 16px 32px rgba(30, 27, 46, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            max-width: 1080px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 4rem;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
        }

        [hidden] {
            display: none !important;
        }

        a {
            color: var(--color-primary);
        }

        /* ---------- En-tête ---------- */

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.5rem 1.75rem;
            margin-bottom: 1.75rem;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            color: #fff;
        }

        header .header-text h1 {
            margin: 0 0 0.25rem;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
        }

        header .header-text p {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
            max-width: 42ch;
        }

        /* ---------- Boutons ---------- */

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font: inherit;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease, color 0.12s ease;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .btn--primary {
            background: #ffffff;
            color: var(--color-primary-dark);
            box-shadow: var(--shadow);
        }

        .btn--primary:hover {
            box-shadow: var(--shadow-hover);
        }

        .btn--accent {
            background: var(--color-primary);
            color: #fff;
        }

        .btn--accent:hover {
            background: var(--color-primary-dark);
        }

        .btn--ghost {
            background: var(--color-surface);
            color: var(--color-text);
            border-color: var(--color-border);
        }

        .btn--ghost:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        .btn--muted {
            background: var(--color-surface);
            color: var(--color-muted);
            border-color: var(--color-border);
        }

        .btn--muted:hover {
            border-color: var(--color-muted);
        }

        .btn--danger {
            background: var(--color-danger-bg);
            color: var(--color-danger);
            border-color: transparent;
        }

        .btn--danger:hover {
            background: var(--color-danger);
            color: #fff;
        }

        .btn--sm {
            padding: 0.4rem 0.85rem;
            font-size: 0.82rem;
        }

        .btn.is-loading {
            opacity: 0.8;
            pointer-events: none;
            transform: scale(0.99);
        }

        /* ---------- Filtres ---------- */

        #filters {
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.75rem;
            background: var(--color-surface);
            box-shadow: var(--shadow);
        }

        #filters h2 {
            margin: 0 0 1rem;
            font-size: 1.2rem;
        }

        #filters-form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        #filters-form label {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-muted);
        }

        #filters-form input,
        #filters-form select,
        #game-form input,
        #game-form select,
        #game-form textarea {
            font: inherit;
            font-weight: 400;
            color: var(--color-text);
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-bg);
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
        }

        #filters-form input:focus,
        #filters-form select:focus,
        #game-form input:focus,
        #game-form select:focus,
        #game-form textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
            background: var(--color-surface);
        }

        #filters-form .form-actions {
            grid-column: 1 / -1;
            align-items: center;
            margin-top: 0.25rem;
        }

        #filters-form .filter-checkbox-inline {
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            grid-column: span 2;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
        }

        #filters-form .filter-checkbox-inline input[type="checkbox"] {
            width: 1.05rem;
            height: 1.05rem;
            flex-shrink: 0;
            accent-color: var(--color-primary);
        }

        #filters-summary {
            margin: 1.1rem 0 0;
            font-weight: 600;
            color: var(--color-primary-dark);
        }

        #filters-summary::before {
            content: "🔎 ";
        }

        /* ---------- Liste des jeux ---------- */

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.1rem;
        }

        #games-container:empty::after {
            content: "😕 Aucun jeu ne correspond à ces critères. Essayez d'élargir vos filtres.";
            grid-column: 1 / -1;
            display: block;
            text-align: center;
            padding: 2.5rem 1rem;
            font-style: italic;
            color: var(--color-muted);
            background: var(--color-surface);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius);
        }

        .game-card {
            display: flex;
            flex-direction: column;
            gap: 0;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--color-surface);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .game-card__image {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 110px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .game-card__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card__badges {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .game-card__badges--standalone {
            position: static;
            flex-direction: row;
            flex-wrap: wrap;
            padding: 0.6rem 0.6rem 0;
        }

        .fit-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 999px;
            font-size: 1rem;
            background: var(--color-surface);
            box-shadow: var(--shadow);
            cursor: help;
        }

        .fit-badge--good {
            box-shadow: 0 0 0 2px var(--color-success), var(--shadow);
        }

        .fit-badge--warning {
            box-shadow: 0 0 0 2px var(--color-warning), var(--shadow);
        }

        .game-card__body {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 1.1rem;
        }

        .game-card__header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .game-card__header h3 {
            margin: 0;
            font-size: 1.15rem;
        }

        .game-card p {
            margin: 0;
            color: var(--color-muted);
            font-size: 0.92rem;
        }

        .game-card__tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            background: var(--color-bg);
            color: var(--color-muted);
            white-space: nowrap;
        }

        .tag--positive {
            background: var(--color-success-bg);
            color: var(--color-success);
        }

        .tag--negative {
            background: var(--color-warning-bg);
            color: var(--color-warning);
        }

        .price-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            white-space: nowrap;
        }

        .price-badge--free {
            background: var(--color-success-bg);
            color: var(--color-success);
        }

        .price-badge--paid {
            background: var(--color-warning-bg);
            color: var(--color-warning);
        }

        .game-card__link {
            margin-top: 0.4rem;
            align-self: flex-start;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--color-primary);
        }

        .game-card__link:hover {
            color: var(--color-primary-dark);
        }

        /* ---------- Vue d'administration ---------- */

        #view-admin {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        #view-admin h2 {
            margin-top: 0;
        }

        .admin-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        #admin-games-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .admin-game-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-bg);
            transition: opacity 0.12s ease;
        }

        .admin-game-row span {
            flex: 1;
            font-weight: 600;
            min-width: 140px;
        }

        .admin-game-row--hidden {
            opacity: 0.6;
        }

        .badge-hidden {
            font-size: 0.72rem;
            font-weight: 700;
            background: var(--color-warning-bg);
            color: var(--color-warning);
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            margin-left: 0.4rem;
        }

        /* ---------- Formulaire d'ajout / modification ---------- */

        #game-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            max-width: 680px;
            margin-top: 1.5rem;
            padding: 1.5rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-bg);
        }

        #game-form h3 {
            grid-column: 1 / -1;
            margin: 0;
        }

        #game-form label {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-muted);
        }

        #game-form label:has(input[type="checkbox"]) {
            flex-direction: row;
            align-items: center;
            font-weight: 600;
            color: var(--color-text);
        }

        #game-form input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--color-primary);
        }

        #game-form textarea {
            min-height: 4.5rem;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            grid-column: 1 / -1;
        }

        /* ---------- Responsive ---------- */

        #oracle-result {
            position: relative;
            isolation: isolate;
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 0.9rem;
            margin-top: 1rem;
            padding: 1rem 1.1rem;
            border-radius: var(--radius);
            border: 1px solid rgba(109, 40, 217, 0.24);
            background: linear-gradient(110deg, rgba(109, 40, 217, 0.12), rgba(6, 182, 212, 0.12) 58%, rgba(255, 255, 255, 0.92));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45), 0 8px 28px rgba(44, 38, 94, 0.1);
            overflow: hidden;
        }

        #oracle-result::before {
            content: "";
            position: absolute;
            z-index: -1;
            inset: -80% auto -80% -35%;
            width: 28%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), rgba(125, 211, 252, 0.38), transparent);
            transform: rotate(18deg) translateX(-180%);
            opacity: 0;
        }

        #oracle-result.is-thinking::before {
            animation: oracle-sweep 1.05s ease-in-out infinite;
        }

        #oracle-result.is-thinking {
            animation: oracle-charge 1s ease-in-out infinite alternate;
        }

        #oracle-result.is-visible {
            animation: oracle-reveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #oracle-result .oracle-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 25%, #ffffff 0 7%, #d9f5ff 16%, #8b5cf6 38%, #312e81 76%);
            box-shadow: 0 0 20px rgba(109, 40, 217, 0.38), inset 0 0 12px rgba(255,255,255,0.8);
        }

        #oracle-result .oracle-visual::before {
            content: "";
            position: absolute;
            inset: -0.45rem;
            border: 1px solid rgba(109, 40, 217, 0.45);
            border-right-color: rgba(6, 182, 212, 0.9);
            border-radius: 50%;
            opacity: 0.6;
        }

        #oracle-result .oracle-visual::after {
            content: "✦";
            position: absolute;
            top: -0.5rem;
            right: -0.35rem;
            color: #d97706;
            font-size: 1.2rem;
            opacity: 0;
            transform: scale(0.4) rotate(-30deg);
        }

        #oracle-result.is-thinking .oracle-visual {
            animation: oracle-pulse 1.1s ease-in-out infinite;
        }

        #oracle-result.is-thinking .oracle-visual::before {
            animation: oracle-orbit 1.6s linear infinite;
        }

        #oracle-result.is-thinking .oracle-visual::after {
            animation: oracle-sparkle 0.8s 0.2s ease-in-out infinite alternate;
        }

        #oracle-result.is-visible .oracle-visual {
            animation: oracle-orb-reveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #oracle-result.is-visible .oracle-visual::after {
            animation: oracle-sparkle 0.7s ease-out both;
        }

        #oracle-result .oracle-orb {
            position: relative;
            display: block;
            width: 3.05rem;
            height: 3.05rem;
            overflow: hidden;
            isolation: isolate;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 25%, #ffffff 0 8%, #e0f2fe 23%, #7dd3fc 64%, #3730a3 100%);
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 18px rgba(125, 211, 252, 0.9), inset 0 0 10px rgba(255,255,255,0.9);
        }

        #oracle-result .oracle-orb-image {
            position: absolute;
            z-index: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
            opacity: 0;
            filter: saturate(1.15) contrast(1.08);
            transform: scale(1.16);
        }

        #oracle-result .oracle-orb-image.is-loaded {
            animation: oracle-image-reveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #oracle-result .oracle-orb::after {
            content: "";
            position: absolute;
            z-index: 1;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 26% 15%, rgba(255,255,255,0.42), transparent 38%), linear-gradient(125deg, transparent 35%, rgba(255,255,255,0.14) 52%, transparent 70%);
            pointer-events: none;
        }

        #oracle-result .oracle-copy {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            color: var(--color-text);
            font-weight: 600;
        }

        #oracle-result .oracle-copy strong {
            font-size: 1.05rem;
            color: var(--color-primary-dark);
        }

        #oracle-result .oracle-copy span {
            color: var(--color-muted);
            font-size: 0.88rem;
            line-height: 1.45;
        }

        #oracle-result.is-thinking .oracle-copy {
            font-style: italic;
        }

        #oracle-result.is-visible .oracle-copy strong {
            animation: oracle-title 0.55s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        #oracle-result.is-visible .oracle-copy span {
            animation: oracle-copy 0.45s 0.28s ease-out both;
        }

        @keyframes oracle-sweep {
            0% { transform: rotate(18deg) translateX(-180%); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: rotate(18deg) translateX(650%); opacity: 0; }
        }

        @keyframes oracle-charge {
            from { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45), 0 6px 20px rgba(44, 38, 94, 0.1); }
            to { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.8), 0 0 30px rgba(109, 40, 217, 0.24); }
        }

        @keyframes oracle-pulse {
            0%, 100% { transform: scale(0.92); box-shadow: 0 0 18px rgba(109, 40, 217, 0.35), inset 0 0 12px rgba(255,255,255,0.8); }
            50% { transform: scale(1.08); box-shadow: 0 0 32px rgba(6, 182, 212, 0.7), inset 0 0 18px #fff; }
        }

        @keyframes oracle-orbit {
            to { transform: rotate(360deg) scale(1.08); }
        }

        @keyframes oracle-sparkle {
            from { opacity: 0.3; transform: scale(0.65) rotate(-25deg); }
            to { opacity: 1; transform: scale(1.25) rotate(20deg); }
        }

        @keyframes oracle-reveal {
            0% { opacity: 0; transform: translateY(16px) scale(0.96); filter: brightness(1.5); }
            65% { opacity: 1; transform: translateY(-2px) scale(1.01); filter: brightness(1.15); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1); }
        }

        @keyframes oracle-orb-reveal {
            0% { transform: scale(0.5) rotate(-35deg); }
            70% { transform: scale(1.14) rotate(8deg); }
            100% { transform: scale(1) rotate(0); }
        }

        @keyframes oracle-title {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes oracle-copy {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes oracle-image-reveal {
            from { opacity: 0; transform: scale(1.16); }
            to { opacity: 0.94; transform: scale(1); }
        }

        #oracle-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 8, 30, 0);
            backdrop-filter: blur(0);
            cursor: pointer;
            transition: background 0.3s ease, backdrop-filter 0.3s ease;
        }

        #oracle-overlay[hidden] { display: none; }

        #oracle-overlay.is-open {
            background: rgba(10, 8, 30, 0.78);
            backdrop-filter: blur(6px);
        }

        #oracle-overlay .oracle-big-orb {
            position: relative;
            width: min(72vw, 72vh, 560px);
            height: min(72vw, 72vh, 560px);
            border-radius: 50%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at 30% 25%, #ffffff 0 6%, #7dd3fc 30%, #6d28d9 62%, #1e1b4b 100%);
            border: 3px solid rgba(255,255,255,0.85);
            box-shadow: 0 0 80px rgba(125, 211, 252, 0.7), 0 0 160px rgba(109, 40, 217, 0.5), inset 0 0 60px rgba(255,255,255,0.45);
            transform: scale(0.08);
            opacity: 0;
        }

        #oracle-overlay.is-open .oracle-big-orb {
            animation: oracle-big-grow 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        #oracle-overlay .oracle-big-image {
            position: absolute;
            z-index: 1;
            left: 50%;
            top: 46%;
            width: 52%;
            height: 52%;
            margin: -26% 0 0 -26%;
            object-fit: cover;
            border-radius: 50%;
            opacity: 0;
            filter: blur(24px) saturate(1.4);
            transform: scale(0.6);
            -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 74%);
            mask-image: radial-gradient(circle, #000 52%, transparent 74%);
        }

        #oracle-overlay .oracle-big-image.is-loaded {
            animation: oracle-big-focus 1.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        #oracle-overlay .oracle-mist {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            transition: opacity 2.4s ease;
        }

        #oracle-overlay .oracle-mist::before {
            content: "";
            position: absolute;
            inset: -10%;
            background:
                radial-gradient(ellipse 40% 28% at 25% 30%, rgba(255,255,255,0.45), transparent 70%),
                radial-gradient(ellipse 45% 30% at 75% 65%, rgba(200,190,255,0.45), transparent 70%),
                radial-gradient(ellipse 35% 25% at 50% 85%, rgba(255,255,255,0.35), transparent 70%);
            filter: blur(14px);
            animation: oracle-mist-swirl 14s linear infinite;
        }

        #oracle-overlay .oracle-figure {
            position: absolute;
            width: 20%;
            height: 38%;
            left: var(--x);
            top: var(--y);
            opacity: 0;
            filter: blur(9px);
            animation: oracle-figure-drift var(--d) ease-in-out var(--delay) infinite;
        }

        #oracle-overlay .oracle-figure::before,
        #oracle-overlay .oracle-figure::after {
            content: "";
            position: absolute;
            left: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.95), rgba(226,220,255,0.55) 65%, transparent 80%);
            transform: translateX(-50%);
        }

        #oracle-overlay .oracle-figure::before {
            top: 0;
            width: 38%;
            height: 28%;
            border-radius: 50%;
        }

        #oracle-overlay .oracle-figure::after {
            top: 32%;
            width: 90%;
            height: 68%;
            border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
        }

        #oracle-overlay .oracle-figure:nth-child(1) { --x: 8%;  --y: 22%; --d: 9s;  --delay: 0s; }
        #oracle-overlay .oracle-figure:nth-child(2) { --x: 70%; --y: 18%; --d: 11s; --delay: -3s; }
        #oracle-overlay .oracle-figure:nth-child(3) { --x: 38%; --y: 56%; --d: 10s; --delay: -6s; }
        #oracle-overlay .oracle-figure:nth-child(4) { --x: 14%; --y: 52%; --d: 12s; --delay: -2s; }
        #oracle-overlay .oracle-figure:nth-child(5) { --x: 66%; --y: 50%; --d: 8s;  --delay: -5s; }

        #oracle-overlay:not(.is-thinking) .oracle-mist {
            opacity: 0.4;
        }

        #oracle-overlay .oracle-big-orb::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 28% 18%, rgba(255,255,255,0.4), transparent 40%);
            pointer-events: none;
        }

        #oracle-overlay .oracle-big-copy {
            position: absolute;
            z-index: 2;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 3.5rem 18% 12%;
            text-align: center;
            color: #fff;
            background: linear-gradient(transparent, rgba(10, 8, 30, 0.85));
            opacity: 0;
            transform: translateY(12px);
        }

        #oracle-overlay .oracle-big-copy.is-shown {
            animation: oracle-copy 0.6s 0.7s ease-out both;
        }

        #oracle-overlay .oracle-big-copy strong {
            display: block;
            font-size: clamp(1.3rem, 4.5vmin, 2.6rem);
            margin-bottom: 0.3rem;
        }

        #oracle-overlay .oracle-big-copy span {
            font-size: clamp(0.85rem, 2.2vmin, 1.1rem);
            line-height: 1.4;
        }

        @keyframes oracle-big-grow {
            from { transform: scale(0.08); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes oracle-big-focus {
            from { opacity: 0; filter: blur(24px) saturate(1.4); transform: scale(0.6); }
            40% { opacity: 0.7; filter: blur(10px) saturate(1.3); }
            to { opacity: 1; filter: blur(0) saturate(1.1); transform: scale(1); }
        }

        @keyframes oracle-mist-swirl {
            to { transform: rotate(360deg); }
        }

        @keyframes oracle-figure-drift {
            0% { opacity: 0; translate: -12% 10%; scale: 0.85; }
            30% { opacity: 0.75; }
            60% { opacity: 0.55; translate: 8% -6%; scale: 1; }
            100% { opacity: 0; translate: 18% -14%; scale: 1.1; }
        }

        @media (prefers-reduced-motion: reduce) {
            #oracle-overlay .oracle-big-orb,
            #oracle-overlay .oracle-big-image,
            #oracle-overlay .oracle-mist,
            #oracle-overlay .oracle-mist::before,
            #oracle-overlay .oracle-figure,
            #oracle-overlay .oracle-big-copy {
                animation: none !important;
                transform: none;
                opacity: 1;
                filter: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #oracle-result,
            #oracle-result::before,
            #oracle-result .oracle-visual,
            #oracle-result .oracle-visual::before,
            #oracle-result .oracle-visual::after,
            #oracle-result .oracle-orb-image,
            #oracle-result .oracle-copy strong,
            #oracle-result .oracle-copy span {
                animation: none !important;
            }
        }

        ];

        const STORAGE_KEY = "game-selector-cache";

        const smartphoneLabels = {
            [SmartphoneCompatibility.NOT_SUPPORTED]: "Non supporté",
            [SmartphoneCompatibility.NOT_RECOMMENDED]: "Non recommandé",
            [SmartphoneCompatibility.ACCEPTABLE]: "Acceptable"
        };

        function generateId() {
            return (crypto.randomUUID) ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        }

        function loadCache() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                console.error("Impossible de lire le cache des jeux :", e);
                return null;
            }
        }

        function saveCache(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // Ajoute dans la liste mise en cache les jeux par défaut qui n'y sont pas encore (par nom),
        // et complète discrètement l'image des jeux déjà en cache qui n'en ont pas encore (mise à jour visuelle),
        // sans toucher au reste de leurs données ni aux jeux ajoutés par l'utilisateur.
        function mergeGames(cachedGames, defaults) {
            const defaultsByName = new Map(defaults.map(game => [game.name, game]));
            const merged = cachedGames.map(game => {
                if (game.image) return game;
                const match = defaultsByName.get(game.name);
                if (!match || !match.image) return game;
                return { ...game, image: match.image };
            });
            const existingNames = new Set(cachedGames.map(game => game.name));
            defaults.forEach(game => {
                if (!existingNames.has(game.name)) {
                    merged.push({ ...game, id: generateId() });
                }
            });
            return merged;
        }

        // Initialise le cache : le crée s'il est vide, le fusionne avec la liste par défaut
        // si la version a changé, ou le laisse tel quel sinon.
        function initGamesCache() {
            const cache = loadCache();

            if (!cache) {
                const gamesWithIds = defaultGames.map(game => ({ ...game, id: generateId() }));
                saveCache({ version, games: gamesWithIds });
                return gamesWithIds;
            }

            if (cache.version !== version) {
                const merged = mergeGames(cache.games, defaultGames);
                saveCache({ version, games: merged });
                return merged;
            }

            return cache.games;
        }

        let games = initGamesCache();

        function persistGames() {
            saveCache({ version, games });
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function escapeAttr(str) {
            return String(str ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }

        // Applique tous les filtres de recherche (nombre de joueurs présents, support navigateur,
        // compte nécessaire, téléchargement, smartphone uniquement, prix, texte libre) aux jeux visibles.
        function getFilteredGames() {
            const playerCountRaw = document.getElementById("filter-player-count").value;
            const playerCount = playerCountRaw ? parseInt(playerCountRaw, 10) : null;
            const web = document.getElementById("filter-web").value;
            const account = document.getElementById("filter-account").value;
            const download = document.getElementById("filter-download").value;
            const smartphoneOnly = document.getElementById("filter-smartphone-only").checked;
            const maxPriceRaw = document.getElementById("filter-max-price").value;
            const maxPrice = maxPriceRaw ? parseFloat(maxPriceRaw) : null;
            const search = document.getElementById("filter-search").value.trim().toLowerCase();

            return games.filter(game => {
                if (game.hidden) return false;
                if (playerCount !== null && (playerCount < game.player_number.min || playerCount > game.player_number.max)) return false;
                if (web === "yes" && !game.web) return false;
                if (web === "no" && game.web) return false;
                if (account === "yes" && !game.accound_needed) return false;
                if (account === "no" && game.accound_needed) return false;
                if (download === "yes" && !game.download) return false;
                if (download === "no" && game.download) return false;
                // Sans PC pour certains participants : on exclut les jeux non supportés sur smartphone
                // (les jeux "non recommandé" restent affichés, avec un avertissement).
                if (smartphoneOnly && game.smartphone === SmartphoneCompatibility.NOT_SUPPORTED) return false;
                if (maxPrice !== null && game.price > maxPrice) return false;
                if (search && !game.name.toLowerCase().includes(search) && !game.description.toLowerCase().includes(search)) return false;
                return true;
            });
        }

        // Calcule, pour chaque critère actif, un badge dédié avec son icône et sa description au survol :
        // un badge par limite réellement approchée, plus un badge "bon match" si tout est confortable.
        function getGameFitBadges(game) {
            const playerCountRaw = document.getElementById("filter-player-count").value;
            const playerCount = playerCountRaw ? parseInt(playerCountRaw, 10) : null;
            const smartphoneOnly = document.getElementById("filter-smartphone-only").checked;

            const badges = [];
            let hasCriteria = false;

            if (playerCount !== null) {
                hasCriteria = true;
                if (playerCount === game.player_number.min) {
                    badges.push({
                        type: "warning",
                        icon: "🔻",
                        title: `Tout juste assez de joueurs : ${playerCount} est le minimum requis (${game.player_number.min}-${game.player_number.max})`
                    });
                } else if (playerCount === game.player_number.max) {
                    badges.push({
                        type: "warning",
                        icon: "🔺",
                        title: `Groupe au maximum supporté : ${playerCount} est le nombre maximum de joueurs (${game.player_number.min}-${game.player_number.max})`
                    });
                }
            }

            if (smartphoneOnly) {
                hasCriteria = true;
                if (game.smartphone === SmartphoneCompatibility.NOT_RECOMMENDED) {
                    badges.push({
                        type: "warning",
                        icon: "📵",
                        title: "Jouable sur smartphone, mais non recommandé (expérience dégradée)"
                    });
                }
            }

            if (badges.length === 0 && hasCriteria) {
                badges.push({
                    type: "good",
                    icon: "✅",
                    title: "Correspond très bien à vos critères actuels"
                });
            }

            return badges;
        }

        // Calcule un score d'adéquation (plus petit = meilleur match) pour trier les jeux les plus adaptés en premier :
        // proximité au nombre idéal de joueurs, pénalité si on est pile à la limite min/max, et si le smartphone
        // n'est pas recommandé alors que certains participants n'ont qu'un smartphone.
        function getGameMatchScore(game) {
            const playerCountRaw = document.getElementById("filter-player-count").value;
            const playerCount = playerCountRaw ? parseInt(playerCountRaw, 10) : null;
            const smartphoneOnly = document.getElementById("filter-smartphone-only").checked;

            let score = 0;

            if (playerCount !== null) {
                score += Math.abs(playerCount - game.player_number.ideal);
                if (playerCount === game.player_number.min || playerCount === game.player_number.max) {
                    score += 50;
                }
            }

            if (smartphoneOnly && game.smartphone === SmartphoneCompatibility.NOT_RECOMMENDED) {
                score += 50;
            }

            return score;
        }

        function getWeightedOracleGames() {
            const filteredGames = getFilteredGames();
            if (filteredGames.length === 0) {
                return [];
            }

            const playerCountRaw = document.getElementById("filter-player-count").value;
            const playerCount = playerCountRaw ? parseInt(playerCountRaw, 10) : null;

            return filteredGames.map(game => {
                let weight = 1;

                if (playerCount !== null && playerCount === game.player_number.ideal) {
                    weight = 2;
                }

                return { game, weight };
            });
        }

        function pickOracleGame() {
            const weightedGames = getWeightedOracleGames();
            if (weightedGames.length === 0) {
                return null;
            }

            const totalWeight = weightedGames.reduce((sum, entry) => sum + entry.weight, 0);
            let random = Math.random() * totalWeight;

            for (const entry of weightedGames) {
                random -= entry.weight;
                if (random <= 0) {
                    return entry.game;
                }
            }

            return weightedGames[weightedGames.length - 1].game;
        }

        function renderGamesView() {
            const container = document.getElementById("games-container");
            const summary = document.getElementById("filters-summary");
            const oracleResult = document.getElementById("oracle-result");
            const oracleImage = oracleResult.querySelector(".oracle-orb-image");
            const oracleCopy = oracleResult.querySelector(".oracle-copy");
            const filteredGames = getFilteredGames()
                .sort((a, b) => getGameMatchScore(a) - getGameMatchScore(b));
            container.innerHTML = "";
            oracleCopy.textContent = "";
            oracleImage.onload = null;
            oracleImage.onerror = null;
            oracleImage.hidden = true;
            oracleImage.classList.remove("is-loaded");
            oracleImage.removeAttribute("src");
            oracleResult.hidden = true;
            oracleResult.classList.remove("is-thinking", "is-visible");
            summary.textContent = filteredGames.length > 1
                ? `${filteredGames.length} jeux correspondent à ces critères.`
                : `${filteredGames.length} jeu correspond à ces critères.`;
            filteredGames.forEach(game => {
                const card = document.createElement("article");
                card.className = "game-card";
                const priceLabel = game.price > 0 ? `${escapeHtml(String(game.price))} €` : "Gratuit";
                const fitBadges = getGameFitBadges(game)
                    .map(badge => `<span class="fit-badge fit-badge--${badge.type}" title="${escapeAttr(badge.title)}">${badge.icon}</span>`)
                    .join("");
                // On n'affiche une zone d'image que si le jeu a une vraie image renseignée ;
                // si elle échoue à charger, on retire simplement la zone.
                const imageBlock = game.image
                    ? `<div class="game-card__image">
                        <img src="${escapeAttr(game.image)}" alt="${escapeAttr(game.name)}" loading="lazy" onerror="this.closest('.game-card__image').remove()">
                        ${fitBadges ? `<div class="game-card__badges">${fitBadges}</div>` : ""}
                    </div>`
                    : (fitBadges ? `<div class="game-card__badges game-card__badges--standalone">${fitBadges}</div>` : "");
                card.innerHTML = `
                    ${imageBlock}
                    <div class="game-card__body">
                        <div class="game-card__header">
                            <h3>${escapeHtml(game.name)}</h3>
                            <span class="price-badge ${game.price > 0 ? "price-badge--paid" : "price-badge--free"}">${priceLabel}</span>
                        </div>
                        <p>${escapeHtml(game.description)}</p>
                        <div class="game-card__tags">
                            <span class="tag">👥 ${game.player_number.min}-${game.player_number.max} (idéal ${game.player_number.ideal})</span>
                            <span class="tag ${game.web ? "tag--positive" : ""}">🌐 ${game.web ? "Navigateur" : "Hors navigateur"}</span>
                            <span class="tag ${!game.accound_needed ? "tag--positive" : "tag--negative"}">🔑 Compte ${game.accound_needed ? "requis" : "non requis"}</span>
                            <span class="tag ${!game.download ? "tag--positive" : "tag--negative"}">⬇️ ${game.download ? "Téléchargement requis" : "Sans téléchargement"}</span>
                            <span class="tag">📱 ${smartphoneLabels[game.smartphone]}</span>
                        </div>
                        <a class="game-card__link" href="${escapeAttr(game.url)}" target="_blank" rel="noopener">Voir le jeu →</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderAdminList() {
            const container = document.getElementById("admin-games-list");
            container.innerHTML = "";
            games.forEach(game => {
                const row = document.createElement("div");
                row.className = game.hidden ? "admin-game-row admin-game-row--hidden" : "admin-game-row";
                row.innerHTML = `
                    <span>${escapeHtml(game.name)}${game.hidden ? '<span class="badge-hidden">Masqué</span>' : ""}</span>
                    <button type="button" class="btn btn--sm btn--muted" data-action="toggle-hidden" data-id="${escapeAttr(game.id)}">${game.hidden ? "👁️ Afficher" : "🙈 Cacher"}</button>
                    <button type="button" class="btn btn--sm btn--ghost" data-action="edit" data-id="${escapeAttr(game.id)}">✏️ Modifier</button>
                    <button type="button" class="btn btn--sm btn--danger" data-action="delete" data-id="${escapeAttr(game.id)}">🗑️ Supprimer</button>
                `;
                container.appendChild(row);
            });
        }

        const viewGames = document.getElementById("view-games");
        const viewAdmin = document.getElementById("view-admin");
        const toggleAdminBtn = document.getElementById("toggle-admin-btn");
        const addGameBtn = document.getElementById("add-game-btn");
        const resetGamesBtn = document.getElementById("reset-games-btn");
        const cancelFormBtn = document.getElementById("cancel-form-btn");
        const gameForm = document.getElementById("game-form");
        const formTitle = document.getElementById("form-title");

        // Simule une "nouvelle page" en basculant simplement la visibilité des sections.
        toggleAdminBtn.addEventListener("click", () => {
            const showAdmin = viewAdmin.hidden;
            viewAdmin.hidden = !showAdmin;
            viewGames.hidden = showAdmin;
            toggleAdminBtn.textContent = showAdmin ? "⬅️ Retour à la liste" : "🛠️ Gérer les jeux";
            if (showAdmin) {
                renderAdminList();
            } else {
                closeForm();
            }
        });

        function openForm(game) {
            formTitle.textContent = game ? "Modifier le jeu" : "Ajouter un jeu";
            document.getElementById("game-id").value = game ? game.id : "";
            document.getElementById("game-name").value = game ? game.name : "";
            document.getElementById("game-description").value = game ? game.description : "";
            document.getElementById("game-url").value = game ? game.url : "";
            document.getElementById("game-web").checked = game ? game.web : false;
            document.getElementById("game-account").checked = game ? game.accound_needed : false;
            document.getElementById("game-download").checked = game ? game.download : false;
            document.getElementById("game-price").value = game ? game.price : 0;
            document.getElementById("game-min").value = game ? game.player_number.min : 1;
            document.getElementById("game-max").value = game ? game.player_number.max : 1;
            document.getElementById("game-ideal").value = game ? game.player_number.ideal : 1;
            document.getElementById("game-smartphone").value = game ? game.smartphone : SmartphoneCompatibility.ACCEPTABLE;
            gameForm.hidden = false;
        }

        function closeForm() {
            gameForm.hidden = true;
            gameForm.reset();
        }

        addGameBtn.addEventListener("click", () => openForm(null));
        cancelFormBtn.addEventListener("click", closeForm);

        // Réinitialise la liste des jeux (et le cache) aux valeurs par défaut d'origine.
        resetGamesBtn.addEventListener("click", () => {
            if (confirm("Réinitialiser la liste des jeux aux valeurs par défaut ? Toutes les modifications, ajouts et suppressions seront perdus.")) {
                games = defaultGames.map(game => ({ ...game, id: generateId() }));
                persistGames();
                renderGamesView();
                renderAdminList();
                closeForm();
            }
        });

        gameForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const id = document.getElementById("game-id").value;
            const gameData = {
                id: id || generateId(),
                name: document.getElementById("game-name").value.trim(),
                web: document.getElementById("game-web").checked,
                accound_needed: document.getElementById("game-account").checked,
                price: parseFloat(document.getElementById("game-price").value) || 0,
                download: document.getElementById("game-download").checked,
                player_number: {
                    min: parseInt(document.getElementById("game-min").value, 10) || 1,
                    max: parseInt(document.getElementById("game-max").value, 10) || 1,
                    ideal: parseInt(document.getElementById("game-ideal").value, 10) || 1
                },
                smartphone: parseInt(document.getElementById("game-smartphone").value, 10),
                url: document.getElementById("game-url").value.trim(),
                description: document.getElementById("game-description").value.trim()
            };

            if (id) {
                const index = games.findIndex(game => game.id === id);
                if (index !== -1) {
                    gameData.hidden = games[index].hidden ?? false;
                    // Conserve l'image existante du jeu (non modifiable depuis ce formulaire).
                    gameData.image = games[index].image;
                    games[index] = gameData;
                }
            } else {
                gameData.hidden = false;
                games.push(gameData);
            }

            persistGames();
            renderGamesView();
            renderAdminList();
            closeForm();
        });

        document.getElementById("admin-games-list").addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) return;

            const id = button.dataset.id;
            const game = games.find(game => game.id === id);
            if (!game) return;

            if (button.dataset.action === "edit") {
                openForm(game);
            } else if (button.dataset.action === "toggle-hidden") {
                game.hidden = !game.hidden;
                persistGames();
                renderGamesView();
                renderAdminList();
            } else if (button.dataset.action === "delete") {
                if (confirm(`Supprimer "${game.name}" ?`)) {
                    games = games.filter(game => game.id !== id);
                    persistGames();
                    renderGamesView();
                    renderAdminList();
                }
            }
        });

        const filtersForm = document.getElementById("filters-form");
        const resetFiltersBtn = document.getElementById("reset-filters-btn");

        // Tout changement dans un filtre recalcule immédiatement la liste des jeux possibles.
        filtersForm.addEventListener("input", renderGamesView);
        filtersForm.addEventListener("change", renderGamesView);
        filtersForm.addEventListener("submit", (event) => event.preventDefault());

        resetFiltersBtn.addEventListener("click", () => {
            filtersForm.reset();
            renderGamesView();
        });

        const oracleOverlay = document.getElementById("oracle-overlay");
        const oracleBigImage = oracleOverlay.querySelector(".oracle-big-image");
        const oracleBigCopy = oracleOverlay.querySelector(".oracle-big-copy");

        function closeOracleOverlay() {
            oracleOverlay.hidden = true;
            oracleOverlay.classList.remove("is-open", "is-thinking");
        }

        oracleOverlay.addEventListener("click", () => {
            if (!oracleOverlay.classList.contains("is-thinking")) closeOracleOverlay();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !oracleOverlay.hidden) closeOracleOverlay();
        });

        document.getElementById("oracle-random-btn").addEventListener("click", () => {
            const selectedGame = pickOracleGame();

            oracleBigImage.onload = null;
            oracleBigImage.onerror = null;
            oracleBigImage.classList.remove("is-loaded");
            oracleBigImage.removeAttribute("src");
            oracleBigCopy.classList.remove("is-shown");
            oracleBigCopy.innerHTML = "";
            oracleOverlay.hidden = false;
            oracleOverlay.classList.remove("is-open");
            void oracleOverlay.offsetWidth;
            oracleOverlay.classList.add("is-open", "is-thinking");

            if (selectedGame && selectedGame.image) {
                oracleBigImage.alt = `Illustration de ${selectedGame.name}`;
                oracleBigImage.onload = () => oracleBigImage.classList.add("is-loaded");
                oracleBigImage.src = selectedGame.image;
            }

            setTimeout(() => {
                oracleOverlay.classList.remove("is-thinking");
                oracleBigCopy.innerHTML = selectedGame
                    ? `<strong>${escapeHtml(selectedGame.name)}</strong><span>${escapeHtml(selectedGame.description)}</span>`
                    : "<strong>Pas de jeu trouvé</strong><span>L'oracle n'a trouvé aucun jeu compatible avec ces filtres.</span>";
                oracleBigCopy.classList.add("is-shown");
            }, 1400);
        });
        renderGamesView();
    </script>
</body>
</html>
